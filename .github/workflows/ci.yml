name: HRX Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build -w packages/shared

      - name: Type-check API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Build Web Application
        run: npm run build -w apps/web

      - name: Run Test Suite (Vitest)
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/hrx_test
          JWT_ACCESS_SECRET: test-super-secret-access-token-key-for-testing-only-12345
          JWT_REFRESH_SECRET: test-super-secret-refresh-token-key-for-testing-only-12345
        run: npm test -w apps/api
